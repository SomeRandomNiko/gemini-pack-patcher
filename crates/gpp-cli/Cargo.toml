[package]
name = "gpp-cli"
description = "Command-line interface for gemini-pack-patcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gpp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
gpp-core = { path = "../gpp-core" }
serde_json = "1.0.154"
ureq = "3.4.2"
