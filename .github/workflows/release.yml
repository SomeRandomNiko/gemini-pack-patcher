name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: gpp }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: gpp.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: gpp }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p gpp-cli --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir out
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} out/
          cd out && tar czf ../gpp-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.exe }}
      - uses: softprops/action-gh-release@v2
        with:
          files: gpp-*.tar.gz
