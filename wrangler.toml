# Cloudflare Workers static assets: serves the built web app from dist/.
# Build first with ./scripts/build-web.sh, then `npx wrangler deploy`.
name = "gemini-pack-patcher"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [{ pattern = "gemini-pack-patcher.lashni.dev", custom_domain = true }]

[assets]
directory = "./dist"
